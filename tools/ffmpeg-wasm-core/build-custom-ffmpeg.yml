name: Build Reproducible FFmpeg WASM Core

on:
  push:
    branches:
      - experimental/ffmpeg-wasm-core
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering build'
        required: false
        default: 'Manual trigger on experimental branch'

permissions:
  contents: read

jobs:
  build-ffmpeg-wasm:
    name: Build FFmpeg 5.1.10 WASM Core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage build workflow for packaging
        run: |
          cp .github/workflows/build-custom-ffmpeg.yml tools/ffmpeg-wasm-core/build-custom-ffmpeg.yml

      - name: Build WebAssembly Core & Package Corresponding Source
        run: |
          mkdir -p output-dist
          docker buildx build \
            --file tools/ffmpeg-wasm-core/Dockerfile \
            --target export \
            --output type=local,dest=./output-dist \
            tools/ffmpeg-wasm-core

      - name: Verify Artifacts and Checksums
        run: |
          cd output-dist
          echo "=== SHA-256 CHECKSUMS ==="
          cat SHA256SUMS.txt
          echo ""
          sha256sum --check SHA256SUMS.txt
          echo ""
          echo "=== MANIFEST ==="
          cat manifest.json

      - name: Verify Corresponding Source Archive Completeness
        run: |
          echo "=== VERIFYING CORRESPONDING SOURCE ARCHIVE CONTENTS ==="
          tar -ztvf output-dist/ffmpeg-corresponding-source-5.1.10.tar.gz > /tmp/archive_contents.txt
          for req in \
            "ffmpeg/fftools/ffmpeg.c" \
            "ffmpeg/fftools/ffprobe.c" \
            "ffmpeg/fftools/cmdutils.c" \
            "x264/x264.h" \
            "libvpx/vpx/vpx_codec.h" \
            "lame.tar.gz" \
            "libogg.tar.gz" \
            "libvorbis.tar.gz" \
            "libopus.tar.gz" \
            "checksums.txt" \
            "sources.env" \
            "patch-wasm.py" \
            "post.js" \
            "build-scripts/Dockerfile" \
            "build-scripts/build-custom-ffmpeg.yml" \
            "build-scripts/README.md" \
            "LICENSES/GPL-2.0.txt" \
            "patches/ffmpeg-5.1.10-wasm.patch"; do
            if ! grep -q "$req" /tmp/archive_contents.txt; then
              echo "ERROR: Missing required corresponding-source entry: $req"
              exit 1
            fi
            echo " Verified: $req"
          done
          echo "All required corresponding-source files are verified present."

      - name: Generate GitHub Workflow Summary
        run: |
          echo "###  FFmpeg 5.1.10 WASM Core Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for f in output-dist/*; do
            echo "| \`$(basename $f)\` | $(ls -lh $f | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat output-dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Core Binaries and Source Archive
        uses: actions/upload-artifact@v4
        with:
          name: gravipress-ffmpeg-core-5.1.10
          path: output-dist/
          retention-days: 14
          if-no-files-found: error
