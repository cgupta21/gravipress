name: Build Reproducible FFmpeg WASM Core

on:
  push:
    branches:
      - experimental/ffmpeg-wasm-core
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering build'
        required: false
        default: 'Manual trigger on experimental branch'

permissions:
  contents: read

jobs:
  build-ffmpeg-wasm:
    name: Build FFmpeg 6.1.6 WASM Core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WebAssembly Core & Package Corresponding Source
        run: |
          mkdir -p output-dist
          docker buildx build \
            --file tools/ffmpeg-wasm-core/Dockerfile \
            --target export \
            --output type=local,dest=./output-dist \
            tools/ffmpeg-wasm-core

      - name: Verify Artifacts and Checksums
        run: |
          cd output-dist
          echo "=== SHA-256 CHECKSUMS ==="
          cat SHA256SUMS.txt
          echo ""
          sha256sum --check SHA256SUMS.txt
          echo ""
          echo "=== MANIFEST ==="
          cat manifest.json

      - name: Generate GitHub Workflow Summary
        run: |
          echo "###  FFmpeg 6.1.6 WASM Core Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for f in output-dist/*; do
            echo "| \`$(basename $f)\` | $(ls -lh $f | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat output-dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Core Binaries and Source Archive
        uses: actions/upload-artifact@v4
        with:
          name: gravipress-ffmpeg-core-6.1.6
          path: output-dist/
          retention-days: 14
          if-no-files-found: error
